[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-profile-api"
version = "1.0.0"
description = "HTTP API that turns a LinkedIn profile URL into structured JSON"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "curl-cffi>=0.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

# Declared explicitly rather than relying on auto-discovery: discovery silently
# produces an EMPTY distribution when the source tree is not present at build
# time, which is easy to do in a Dockerfile and hard to notice, since the app
# still runs by importing from the working directory.
[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["fixtures/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
